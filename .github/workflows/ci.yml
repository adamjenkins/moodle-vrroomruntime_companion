# The concurrency block, the development leftover check and the codebase completeness check follow
# ideas from the moodle-workflows collection of Moodle an Hochschulen e.V.
# (https://github.com/moodle-an-hochschulen/moodle-workflows), re-implemented here.
name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        # MOODLE_503_STABLE's minimum (environment.xml 5.3 block: PostgreSQL >= 17). A newer
        # image would mask minimum-version breakage.
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        # MOODLE_503_STABLE's minimum (environment.xml 5.3 block: MariaDB >= 11.4).
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      # Moodle 5.3 only for now, as for mod_vrroom (owner, 2026-10-08). Its PHP floor and ceiling
      # (8.3 and 8.4, from MOODLE_503_STABLE's environment.xml and core's push.yml), with the two
      # database engines alternating so both are exercised.
      matrix:
        include:
          - {moodle-branch: MOODLE_503_STABLE, php: '8.3', database: mariadb}
          - {moodle-branch: MOODLE_503_STABLE, php: '8.4', database: pgsql}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # This is a sub-plugin of mod_vrroom (installed at mod/vrroom/runtime/companion) and needs its
      # built-in run mode vrroomruntime_builtin, which mod_vrroom bundles. moodle-plugin-ci installs
      # mod_vrroom first (a sub-plugin's parent is an implied dependency), then this plugin into it.
      # The mod_vrroom repository is private for now: set the repository secret MOD_VRROOM_TOKEN to a
      # fine-grained token that can read it (Contents: read-only). Without the secret the public URL is
      # used, which works once mod_vrroom is public. The token goes into an HTTP header for git (as
      # actions/checkout does), never into a clone URL: moodle-plugin-ci prints a failed command
      # wrapped across lines, which defeats the log masking of secrets.
      - name: Add mod_vrroom
        run: |
          if [ -n "$MOD_VRROOM_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$MOD_VRROOM_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git config --global http.https://github.com/adamjenkins/moodle-mod_vrroom.git/.extraheader "AUTHORIZATION: basic $auth"
          fi
          moodle-plugin-ci add-plugin adamjenkins/moodle-mod_vrroom
          git config --global --unset-all http.https://github.com/adamjenkins/moodle-mod_vrroom.git/.extraheader || true
        env:
          MOD_VRROOM_TOKEN: ${{ secrets.MOD_VRROOM_TOKEN }}

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Development leftover check
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: |
          # Code files only; the vendored LiveKit client (thirdpartylibs.xml) and generated amd/build are not our code.
          if grep -rnE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build \
              --include='*.php' --include='*.js' --include='*.mjs' --include='*.mustache' --include='*.feature' \
              --include='*.xml' --include='*.json' --include='*.scss' --include='*.css' --include='*.sh' \
              --exclude=livekit.js \
              -e '@testme' -e 'TODO' -e '^<<<<<<< ' -e '^>>>>>>> ' .; then
            echo "::error::Development leftovers found (TODO, @testme or merge conflict markers)."
            exit 1
          fi
          echo "No development leftovers found."

      # The plugin must ship a version.php, its English language file and a privacy provider; the
      # repository a licence (LICENSE or COPYING.txt) and a README.
      - name: Codebase completeness check
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: |
          missing=0
          need() { if [ ! -f "$1" ]; then echo "::error file=$1::Missing $1"; missing=1; fi; }
          [ -f LICENSE ] || [ -f COPYING.txt ] || { echo "::error::Missing LICENSE or COPYING.txt"; missing=1; }
          need README.md
          need version.php
          component=$(grep -oP "\\\$plugin->component\s*=\s*'\K[a-z0-9_]+" version.php || true)
          if [ -z "$component" ]; then
            echo "::error file=version.php::No \$plugin->component"
            exit 1
          fi
          need "lang/en/${component}.php"
          need classes/privacy/provider.php
          echo "$component: checked"
          exit $missing

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Setup Node (Moodle 5.3's .nvmrc is lts/jod, Node 22)
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # moodle-plugin-ci grunt passes every amd/src file to ESLint by name, so the vendored LiveKit
      # bundle (amd/src/livekit.js, declared in thirdpartylibs.xml) draws an "ignored file" warning
      # and fails --max-lint-warnings 0. Lint the directory instead (ESLint then skips the bundle
      # silently once ignorefiles has written the thirdpartylibs.xml entries to .eslintignore), rebuild
      # with this branch's toolchain and fail if the committed amd/build differs.
      - name: Grunt
        if: ${{ !cancelled() }}
        working-directory: moodle
        run: |
          npx grunt ignorefiles
          npx eslint --max-warnings 0 public/mod/vrroom/runtime/companion/amd/src
          npx grunt rollup --root=public/mod/vrroom/runtime/companion
          diff -r ../plugin/amd/build public/mod/vrroom/runtime/companion/amd/build

      # The client side of the companion wire protocol (amd/src/syncprotocol.js).
      - name: JavaScript tests
        if: ${{ !cancelled() }}
        run: node --test plugin/tests/js/*.mjs

      # moodle-plugin-ci phpunit runs this plugin's own vrroomruntime_companion_testsuite.
      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # No Behat step: the plugin has no .feature files.

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
